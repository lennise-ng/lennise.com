<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · {{site_name}}</title>
<meta name="description" content="{{description}}">
<link rel="alternate" type="application/rss+xml" title="{{site_name}}" href="/feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Inter:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">

<header class="masthead">
  <p class="tagline">{{tagline}}</p>
  <nav aria-label="Site">
    <a href="/">Home</a>
    <a href="/essays/">Essays</a>
    <a href="/margins/">Margins</a>
    <a href="/#letters">Letters</a>
    <a href="/about/">About</a>
  </nav>
</header>

{{body}}

<footer class="colophon">
  <div class="links">
    <a href="/feed.xml">RSS</a>
    <a href="mailto:{{email}}">{{email}}</a>
  </div>
  <span>Kuala Lumpur · {{year}}</span>
</footer>

</div>
</body>
</html>
